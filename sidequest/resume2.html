<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture Resume Builder</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ui-sans:'Instrument Sans',sans-serif;
  --resume-serif:'EB Garamond',Georgia,serif;
  --resume-mono:'DM Mono',monospace;
  --panel-bg:#f7f5f2;
  --border:#ddd8d0;
  --danger:#c0392b;
  --add:#2c6e49;
  --ui-text:#1a1a1a;
  --muted:#777;
  --input-bg:#fff;
  --sidebar-w:390px;
}
html,body{height:100%}
body{font-family:var(--ui-sans);background:#eceae5;color:var(--ui-text);display:flex;flex-direction:column;min-height:100vh}

.topbar{background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;position:sticky;top:0;z-index:100;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:8px}
.topbar-title{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.topbar-sub{font-size:11px;color:#888;margin-left:4px}
.topbar-actions{display:flex;gap:10px;align-items:center}
.btn-pdf{background:#fff;color:#1a1a1a;border:none;padding:7px 18px;font-family:var(--ui-sans);font-size:12px;font-weight:600;letter-spacing:.04em;cursor:pointer;border-radius:4px;transition:background .15s}
.btn-pdf:hover{background:#e8e4de}
.btn-pdf:active{transform:scale(.98)}
.pdf-loading{font-size:11px;color:#aaa;display:none}

.app-body{display:flex;flex:1;overflow:hidden;height:calc(100vh - 52px)}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--panel-bg);border-right:1px solid var(--border);overflow-y:auto;padding:20px 18px 40px;display:flex;flex-direction:column;gap:0}
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

.editor-section{margin-bottom:16px}
.editor-section-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#e8e3dc;border-radius:5px;cursor:pointer;user-select:none}
.editor-section-head:hover{background:#ddd8d0}
.section-label-ui{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#555}
.section-toggle{font-size:13px;color:#888;transition:transform .2s;line-height:1}
.section-toggle.open{transform:rotate(180deg)}
.section-body{display:none;padding-top:10px}
.section-body.open{display:block}

.field-group{margin-bottom:9px}
.field-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block}
.field-input{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;padding:7px 9px;font-family:var(--ui-sans);font-size:12.5px;color:var(--ui-text);outline:none;transition:border-color .15s}
.field-input:focus{border-color:#999}

.entry-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:12px 12px 10px;margin-bottom:8px}
.entry-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.entry-card-title{font-size:11px;font-weight:600;color:#444;text-transform:uppercase;letter-spacing:.06em}
.btn-remove{background:none;border:1px solid #e0b0aa;color:var(--danger);padding:2px 8px;font-size:10px;border-radius:3px;cursor:pointer;font-family:var(--ui-sans)}
.btn-remove:hover{background:#fdf0ee}
.btn-add{width:100%;background:none;border:1px dashed #9abeaa;color:var(--add);padding:7px;font-size:11px;font-weight:600;border-radius:4px;cursor:pointer;font-family:var(--ui-sans);letter-spacing:.04em;margin-top:4px;transition:background .15s}
.btn-add:hover{background:#edf5f0}

.bullets-list{margin-bottom:6px}
.bullet-row-ui{display:flex;align-items:flex-start;gap:6px;margin-bottom:5px}
.bullet-row-ui textarea{flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;padding:5px 8px;font-size:12px;font-family:var(--ui-sans);color:var(--ui-text);resize:vertical;min-height:48px;outline:none;line-height:1.4}
.bullet-row-ui textarea:focus{border-color:#999}
.btn-remove-bullet{background:none;border:none;color:#bbb;cursor:pointer;font-size:18px;padding:2px 4px;line-height:1;margin-top:3px;flex-shrink:0}
.btn-remove-bullet:hover{color:var(--danger)}
.btn-add-bullet{background:none;border:1px dashed #ccc;color:#888;padding:4px 10px;font-size:10px;border-radius:3px;cursor:pointer;font-family:var(--ui-sans)}
.btn-add-bullet:hover{background:#f5f5f5}

/* PREVIEW */
.preview-area{flex:1;overflow-y:auto;padding:32px 24px;display:flex;flex-direction:column;align-items:center;background:#ddd8d0}
.preview-area::-webkit-scrollbar{width:6px}
.preview-area::-webkit-scrollbar-thumb{background:#bbb;border-radius:3px}

/* RESUME PAPER */
#resume-paper{width:794px;min-height:1122px;background:#fff;box-shadow:0 4px 32px rgba(0,0,0,.18);padding:48px 50px 48px;font-family:var(--resume-serif);font-size:10.5pt;line-height:1.55;color:#1a1a1a;flex-shrink:0}

.r-header{display:grid;grid-template-columns:1fr auto;align-items:end;border-bottom:1.5px solid #1a1a1a;padding-bottom:10px;margin-bottom:14px;gap:12px}
.r-name{font-family:var(--resume-serif);font-size:25pt;font-weight:400;letter-spacing:.01em;line-height:1;color:#1a1a1a}
.r-name-sub{font-family:var(--resume-mono);font-size:7.8pt;letter-spacing:.14em;text-transform:uppercase;color:#666;margin-top:5px}
.r-contact{text-align:right;font-family:var(--resume-mono);font-size:7.6pt;color:#444;line-height:1.75}

.r-section{margin-bottom:12px}
.r-section-label{font-family:var(--resume-mono);font-size:7.3pt;text-transform:uppercase;letter-spacing:.16em;color:#888;border-bottom:.5px solid #ccc;padding-bottom:3px;margin-bottom:8px}

.r-entry{margin-bottom:8px}
.r-entry-head{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px}
.r-entry-title{font-weight:500;font-size:10.5pt}
.r-entry-date{font-family:var(--resume-mono);font-size:7.6pt;color:#888;white-space:nowrap}
.r-entry-sub{font-size:9.3pt;color:#555;font-style:italic}
.r-entry-note{font-size:9.3pt;color:#444;margin-top:1px}

ul.r-bullets{list-style:none;padding:0;margin-top:4px}
ul.r-bullets li{padding-left:1em;position:relative;font-size:9.6pt;color:#333;margin-bottom:2px;line-height:1.5}
ul.r-bullets li::before{content:'—';position:absolute;left:0;color:#aaa;font-family:var(--resume-mono);font-size:8pt;top:1px}

.r-skills-grid{display:grid;grid-template-columns:112px 1fr;gap:3px 12px;font-size:9.3pt}
.r-skill-cat{font-family:var(--resume-mono);font-size:7.8pt;color:#888;padding-top:1px}
.r-skill-val{color:#333}

.r-two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}

.r-activity-row{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px;font-size:9.6pt;padding:2px 0;border-bottom:.5px dotted #e0e0e0}
.r-activity-row:last-child{border-bottom:none}
.r-act-name{color:#1a1a1a}
.r-act-meta{font-family:var(--resume-mono);font-size:7.6pt;color:#888;white-space:nowrap}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-title">Resume Builder</span>
    <span class="topbar-sub">Architecture · Nepal</span>
  </div>
  <div class="topbar-actions">
    <span class="pdf-loading" id="pdf-loading">Generating PDF…</span>
    <button class="btn-pdf" onclick="downloadPDF()">⬇ Download PDF</button>
  </div>
</div>

<div class="app-body">
  <div class="sidebar" id="sidebar">

    <div class="editor-section">
      <div class="editor-section-head" onclick="toggleSection(this)">

      </div>
      <div class="section-body open">
        <div class="field-group"><label class="field-label">Full Name</label><input class="field-input" id="f-name" value="Aarav Shrestha"></div>
        <div class="field-group"><label class="field-label">Subtitle</label><input class="field-input" id="f-subtitle" value="B.Arch Candidate · 4th Semester"></div>
        <div class="field-group"><label class="field-label">Phone</label><input class="field-input" id="f-phone" value="+977 98XXXXXXXX"></div>
        <div class="field-group"><label class="field-label">Email</label><input class="field-input" id="f-email" value="aarav.shrestha@email.com"></div>
        <div class="field-group"><label class="field-label">City</label><input class="field-input" id="f-city" value="Kathmandu, Nepal"></div>
        <div class="field-group"><label class="field-label">Portfolio URL</label><input class="field-input" id="f-portfolio" value="aaravshrestha.myportfolio.com"></div>
      </div>
    </div>

    <div class="editor-section">
      <div class="editor-section-head" onclick="toggleSection(this)">
        <span class="section-label-ui">Education</span>
        <span class="section-toggle open">▾</span>
      </div>
      <div class="section-body open" id="edu-entries"></div>
    </div>

    <div class="editor-section">
      <div class="editor-section-head" onclick="toggleSection(this)">
        <span class="section-label-ui">Skills</span>
        <span class="section-toggle open">▾</span>
      </div>
      <div class="section-body open" id="skills-entries"></div>
    </div>

    <div class="editor-section">
      <div class="editor-section-head" onclick="toggleSection(this)">
        <span class="section-label-ui">Studio Projects</span>
        <span class="section-toggle open">▾</span>
      </div>
      <div class="section-body open" id="proj-entries"></div>
    </div>

    <div class="editor-section">
      <div class="editor-section-head" onclick="toggleSection(this)">
        <span class="section-label-ui">Model Making</span>
        <span class="section-toggle open">▾</span>
      </div>
      <div class="section-body open" id="model-entries"></div>
    </div>

    <div class="editor-section">
      <div class="editor-section-head" onclick="toggleSection(this)">
        <span class="section-label-ui">Site Studies &amp; Visits</span>
        <span class="section-toggle open">▾</span>
      </div>
      <div class="section-body open" id="site-entries"></div>
    </div>

    <div class="editor-section">
      <div class="editor-section-head" onclick="toggleSection(this)">
        <span class="section-label-ui">Awards &amp; Activities</span>
        <span class="section-toggle open">▾</span>
      </div>
      <div class="section-body open" id="act-entries"></div>
    </div>

  </div>

  <div class="preview-area">
    <div id="resume-paper"></div>
  </div>
</div>

<script>
const data = {
  name: "Aarav Shrestha",
  subtitle: "B.Arch Candidate · 4th Semester",
  phone: "+977 98XXXXXXXX",
  email: "aarav.shrestha@email.com",
  city: "Kathmandu, Nepal",
  portfolio: "aaravshrestha.myportfolio.com",

  education: [
    {
      title: "Bachelor of Architecture (B.Arch)",
      date: "2023 — Present",
      sub: "Tribhuvan University · IOE, Pulchowk Campus — Lalitpur, Nepal",
      note: "Currently in 4th Semester · CGPA: 3.6 / 4.0"
    },
    {
      title: "+2 Science (Physics, Chemistry, Mathematics)",
      date: "2021 — 2023",
      sub: "Sifal Secondary School — Kathmandu, Nepal",
      note: "GPA: 3.76 / 4.0"
    }
  ],

  skills: [
    { cat: "Software", val: "AutoCAD (proficient) · SketchUp (proficient) · Rhino 3D (developing) · Photoshop · Illustrator" },
    { cat: "Drawing", val: "Hand drafting · Orthographic projection · Section-perspective · Construction detailing" },
    { cat: "Physical making", val: "Cardboard, foam board, balsa wood, chipboard · Scales 1:500 to 1:50" },
    { cat: "Site work", val: "Measured drawing · Condition survey · Sketch documentation · Photography" },
    { cat: "Languages", val: "Nepali (native) · English (fluent) · Hindi (conversational)" }
  ],

  projects: [

  sites: [

      title: "Heritage Documentation Study — Patan Durbar Square",

      ]
    },
    {

        "Findings contributed to a group urban analysis presentation delivered to a visiting studio critic"
      ]
    },

      title: "Construction Site Visit — RC Frame Residential, Bhaisepati",

      ]
    }
  ],

  activities: [
    { name: "Dean's Merit List — Institute of Engineering, TU", meta: "Sem 1 & 2, 2023–24" },
    { name: "Member — Society of Architecture Students (SAS), Pulchowk Campus", meta: "2023 — Present" },
    { name: "Volunteer — UNESCO Kathmandu Valley Heritage Documentation Walk, Patan", meta: "Nov 2024" },
    { name: "Participant — Architecture Sketch Walk, Bhaktapur (organised by SAS)", meta: "Oct 2024" }
  ]
};

// ===== HELPERS =====
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

function makeBulletsUI(section, i, bullets){
  const wrap = document.createElement('div');
  wrap.className = 'bullets-list';
  bullets.forEach((b, bi) => {
    const row = document.createElement('div');
    row.className = 'bullet-row-ui';
    const ta = document.createElement('textarea');
    ta.value = b;
    ta.addEventListener('input', function(){ data[section][i].bullets[bi] = this.value; render(); });
    const rm = document.createElement('button');
    rm.className = 'btn-remove-bullet'; rm.textContent = '×';
    rm.addEventListener('click', () => { removeBullet(section, i, bi); });
    row.appendChild(ta); row.appendChild(rm);
    wrap.appendChild(row);
  });
  const addB = document.createElement('button');
  addB.className = 'btn-add-bullet'; addB.textContent = '+ Add bullet';
  addB.addEventListener('click', () => addBullet(section, i));
  wrap.appendChild(addB);
  return wrap;
}

function makeCard(label, removeSection, removeIdx, fields, bulletSection){
  const card = document.createElement('div');
  card.className = 'entry-card';
  const head = document.createElement('div');
  head.className = 'entry-card-head';
  head.innerHTML = `<span class="entry-card-title">${label}</span>`;
  const rmBtn = document.createElement('button');
  rmBtn.className = 'btn-remove'; rmBtn.textContent = '✕ Remove';
  rmBtn.addEventListener('click', () => removeItem(removeSection, removeIdx));
  head.appendChild(rmBtn);
  card.appendChild(head);
  fields.forEach(f => {
    const fg = document.createElement('div');
    fg.className = 'field-group';
    fg.innerHTML = `<label class="field-label">${f.label}</label><input class="field-input" value="${esc(f.val)}">`;
    fg.querySelector('input').addEventListener('input', function(){ f.onchange(this.value); });
    card.appendChild(fg);
  });
  if(bulletSection !== undefined){
    const fg = document.createElement('div');
    fg.className = 'field-group';
    fg.innerHTML = '<label class="field-label">Bullet Points</label>';
    fg.appendChild(makeBulletsUI(bulletSection, removeIdx, data[bulletSection][removeIdx].bullets));
    card.appendChild(fg);
  }
  return card;
}

function addAddBtn(el, label, section){
  const b = document.createElement('button');
  b.className = 'btn-add'; b.textContent = '+ ' + label;
  b.addEventListener('click', () => addItem(section));
  el.appendChild(b);
}

// ===== SIDEBAR BUILDERS =====
function buildEduSidebar(){
  const el = document.getElementById('edu-entries'); el.innerHTML = '';
  data.education.forEach((e,i) => {
    el.appendChild(makeCard(`Entry ${i+1}`, 'education', i, [
      { label:'Degree / Title', val:e.title, onchange: v => { data.education[i].title=v; render(); } },
      { label:'Date Range', val:e.date, onchange: v => { data.education[i].date=v; render(); } },
      { label:'Institution · Location', val:e.sub, onchange: v => { data.education[i].sub=v; render(); } },
      { label:'Note (CGPA, semester)', val:e.note, onchange: v => { data.education[i].note=v; render(); } }
    ]));
  });
  addAddBtn(el, 'Add Education', 'education');
}

function buildSkillsSidebar(){
  const el = document.getElementById('skills-entries'); el.innerHTML = '';
  data.skills.forEach((sk,i) => {
    el.appendChild(makeCard(`Row ${i+1}`, 'skills', i, [
      { label:'Category', val:sk.cat, onchange: v => { data.skills[i].cat=v; render(); } },
      { label:'Values', val:sk.val, onchange: v => { data.skills[i].val=v; render(); } }
    ]));
  });
  addAddBtn(el, 'Add Skill Row', 'skills');
}

function buildProjSidebar(){
  const el = document.getElementById('proj-entries'); el.innerHTML = '';
  data.projects.forEach((p,i) => {
    el.appendChild(makeCard(`Project ${i+1}`, 'projects', i, [
      { label:'Project Title', val:p.title, onchange: v => { data.projects[i].title=v; render(); } },
      { label:'Semester / Date', val:p.date, onchange: v => { data.projects[i].date=v; render(); } },
      { label:'Description (italic)', val:p.desc, onchange: v => { data.projects[i].desc=v; render(); } }
    ], 'projects'));
  });
  addAddBtn(el, 'Add Project', 'projects');
}

function buildModelSidebar(){
  const el = document.getElementById('model-entries'); el.innerHTML = '';
  data.models.forEach((m,i) => {
    el.appendChild(makeCard(`Entry ${i+1}`, 'models', i, [
      { label:'Competition / Workshop Title', val:m.title, onchange: v => { data.models[i].title=v; render(); } },
      { label:'Organiser · Date', val:m.date, onchange: v => { data.models[i].date=v; render(); } }
    ], 'models'));
  });
  addAddBtn(el, 'Add Model Entry', 'models');
}

function buildSiteSidebar(){
  const el = document.getElementById('site-entries'); el.innerHTML = '';
  data.sites.forEach((s,i) => {
    el.appendChild(makeCard(`Visit ${i+1}`, 'sites', i, [
      { label:'Study / Visit Title', val:s.title, onchange: v => { data.sites[i].title=v; render(); } },
      { label:'Date', val:s.date, onchange: v => { data.sites[i].date=v; render(); } }
    ], 'sites'));
  });
  addAddBtn(el, 'Add Site Visit', 'sites');
}

function buildActSidebar(){
  const el = document.getElementById('act-entries'); el.innerHTML = '';
  data.activities.forEach((a,i) => {
    el.appendChild(makeCard(`Item ${i+1}`, 'activities', i, [
      { label:'Award / Activity Name', val:a.name, onchange: v => { data.activities[i].name=v; render(); } },
      { label:'Date / Year', val:a.meta, onchange: v => { data.activities[i].meta=v; render(); } }
    ]));
  });
  addAddBtn(el, 'Add Award / Activity', 'activities');
}

// ===== DEFAULTS =====
const defaults = {
  education: { title:"Degree Title", date:"Year — Year", sub:"Institution — Location", note:"" },
  skills: { cat:"Category", val:"Skill · Skill · Skill" },
  projects: { title:"Project Title", date:"Nth Sem, Year", desc:"Brief concept description", bullets:["Describe the project, scale, tools used, and outcome."] },
  models: { title:"Competition / Workshop Title", date:"Organiser, Month Year", bullets:["Describe the model, scale, materials, and any recognition."] },
  sites: { title:"Site Study Title — Location", date:"Month Year", bullets:["Describe what you documented, methods used, and how it fed into coursework."] },
  activities: { name:"Award or Activity Name", meta:"Year" }
};

function addItem(s){ data[s].push(JSON.parse(JSON.stringify(defaults[s]))); rebuildSection(s); render(); }
function removeItem(s,i){ data[s].splice(i,1); rebuildSection(s); render(); }
function addBullet(s,i){ data[s][i].bullets.push("New bullet point."); rebuildSection(s); render(); }
function removeBullet(s,i,bi){ data[s][i].bullets.splice(bi,1); rebuildSection(s); render(); }
function rebuildSection(s){
  ({ education:buildEduSidebar, skills:buildSkillsSidebar, projects:buildProjSidebar, models:buildModelSidebar, sites:buildSiteSidebar, activities:buildActSidebar })[s]();
}

// ===== HEADER WIRING =====
['name','subtitle','phone','email','city','portfolio'].forEach(k => {
  document.getElementById('f-'+k).addEventListener('input', function(){ data[k]=this.value; render(); });
});

// ===== RENDER RESUME =====
function render(){
  const paper = document.getElementById('resume-paper');

  const eduHtml = data.education.map(e => `
    <div class="r-entry">
      <div class="r-entry-head"><span class="r-entry-title">${e.title}</span><span class="r-entry-date">${e.date}</span></div>
      ${e.sub ? `<div class="r-entry-sub">${e.sub}</div>` : ''}
      ${e.note ? `<div class="r-entry-note">${e.note}</div>` : ''}
    </div>`).join('');

  const skillsHtml = data.skills.map(s =>
    `<span class="r-skill-cat">${s.cat}</span><span class="r-skill-val">${s.val}</span>`).join('');

  const projHtml = data.projects.map(p => `
    <div class="r-entry">
      <div class="r-entry-head"><span class="r-entry-title">${p.title}</span><span class="r-entry-date">${p.date}</span></div>
      ${p.desc ? `<div class="r-entry-sub">${p.desc}</div>` : ''}
      ${p.bullets.length ? `<ul class="r-bullets">${p.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>` : ''}
    </div>`).join('');

  const modelHtml = data.models.map(m => `
    <div class="r-entry">
      <div class="r-entry-head"><span class="r-entry-title">${m.title}</span><span class="r-entry-date">${m.date}</span></div>
      ${m.bullets.length ? `<ul class="r-bullets">${m.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>` : ''}
    </div>`).join('');

  const siteHtml = data.sites.map(s => `
    <div class="r-entry">
      <div class="r-entry-head"><span class="r-entry-title">${s.title}</span><span class="r-entry-date">${s.date}</span></div>
      ${s.bullets.length ? `<ul class="r-bullets">${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>` : ''}
    </div>`).join('');

  const actHtml = data.activities.map(a => `
    <div class="r-activity-row">
      <span class="r-act-name">${a.name}</span>
      <span class="r-act-meta">${a.meta}</span>
    </div>`).join('');

  paper.innerHTML = `
    <div class="r-header">
      <div>
        <div class="r-name">${data.name || '&nbsp;'}</div>
        ${data.subtitle ? `<div class="r-name-sub">${data.subtitle}</div>` : ''}
      </div>
      <div class="r-contact">
        ${data.phone}<br>
        ${data.email}<br>
        ${data.city}<br>
        ${data.portfolio}
      </div>
    </div>

    ${data.education.length ? `<div class="r-section"><div class="r-section-label">Education</div>${eduHtml}</div>` : ''}
    ${data.skills.length ? `<div class="r-section"><div class="r-section-label">Skills</div><div class="r-skills-grid">${skillsHtml}</div></div>` : ''}
    ${data.projects.length ? `<div class="r-section"><div class="r-section-label">Studio Projects</div>${projHtml}</div>` : ''}
    ${data.models.length ? `<div class="r-section"><div class="r-section-label">Model Making</div>${modelHtml}</div>` : ''}
    ${data.sites.length ? `<div class="r-section"><div class="r-section-label">Site Studies &amp; Field Visits</div>${siteHtml}</div>` : ''}
    ${data.activities.length ? `<div class="r-section"><div class="r-section-label">Awards &amp; Activities</div>${actHtml}</div>` : ''}
  `;
}

// ===== TOGGLE =====
function toggleSection(head){
  const body = head.nextElementSibling;
  const arrow = head.querySelector('.section-toggle');
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

// ===== PDF =====
function downloadPDF(){
  const loading = document.getElementById('pdf-loading');
  loading.style.display = 'inline';
  const name = (data.name || 'Resume').replace(/\s+/g,'_');
  html2pdf().set({
    margin: 0,
    filename: `${name}_Resume.pdf`,
    image: { type:'jpeg', quality:0.98 },
    html2canvas: { scale:2, useCORS:true, letterRendering:true },
    jsPDF: { unit:'px', format:[794,1122], orientation:'portrait' }
  }).from(document.getElementById('resume-paper')).save().then(() => {
    loading.style.display = 'none';
  });
}

// ===== INIT =====
buildEduSidebar(); buildSkillsSidebar(); buildProjSidebar();
buildModelSidebar(); buildSiteSidebar(); buildActSidebar();
render();
</script>
</body>
</html>
